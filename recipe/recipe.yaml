schema_version: 1

context:
  version: "2.3.3"

package:
  name: python-coreapi
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/coreapi/coreapi-${{ version }}.tar.gz
  sha256: 46145fcc1f7017c076a2ef684969b641d18a2991051fddec9458ad3f78ffc1cb

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools <82
  run:
    - python >=${{ python_min }}
    - python-coreschema
    - requests
    - itypes
    - uritemplate
    # pkg_resources; TODO: patch it out
    - setuptools <82

tests:
  - python:
      imports:
        - coreapi
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Python client library for Core API.
  license: BSD-3-Clause
  license_file: LICENSE.md
  homepage: https://core-api.github.io/python-client/
  repository: https://github.com/core-api/python-client

extra:
  recipe-maintainers:
    - scopatz
    - mgorny
